# ─────────────────────────────────────────────────────────
# DO NOT TOUCH
# ─────────────────────────────────────────────────────────
config-version: 9

# ───────────────────────────────────────────────
# Update Checker
# Set to false to disable update checks.
# Notifies console + OPs when a new version is available.
# ───────────────────────────────────────────────
check-for-updates: true

# ─────────────────────────────────────────────────────────
# Plugin message prefix
# Supports '&' color codes (e.g., &6 = gold, &f = white)
# Appears in front of most chat messages sent by this plugin.
# ─────────────────────────────────────────────────────────
prefix: '&x&F&1&4&1&4&1&lS&x&F&2&5&3&5&3&lt&x&F&4&6&5&6&5&lr&x&F&5&7&7&7&7&le&x&F&7&8&9&8&9&la&x&F&8&9&C&9&C&lm&x&F&9&A&E&A&E&lC&x&F&B&C&0&C&0&lr&x&F&C&D&2&D&2&la&x&F&E&E&4&E&4&lf&x&F&F&F&6&F&6&lt
  &f'

# ─────────────────────────────────────────────────────────
# How many lives new players start with.
# Default: 3
# ─────────────────────────────────────────────────────────
starting-lives: 3

# ─────────────────────────────────────────────────────────
# Lives granted when a player is revived using a Revive Crystal.
# Default: 1
# ─────────────────────────────────────────────────────────
revive-lives: 3

# ─────────────────────────────────────────────────────────
# Lives restored automatically after a temporary ban expires.
# If not set, it falls back to starting-lives.
# Default: 3
# ─────────────────────────────────────────────────────────
post-ban-lives: 3

# ─────────────────────────────────────────────────────────
# Temporary Ban Settings
# When enabled, players with 0 lives will be banned for a limited time
# instead of permanently.
# duration: how long the ban lasts (in minutes)
# Supported units: m = minutes, h = hours, d = days
# Example: "30m", "2h", "1d"
# ─────────────────────────────────────────────────────────
temporary-ban:
  enabled: true
  duration: 1d

# ─────────────────────────────────────────────────────────
# Life Steal Settings
# When a player kills another player, they steal lives.
# ─────────────────────────────────────────────────────────
life-steal:
  enabled: false
  amount: 1
  broadcast: true

# ─────────────────────────────────────────────────────────
# Maximum lives a player can have.
# Once this limit is reached, they cannot gain more lives.
# Set this to -1 to allow players to have unlimited lives.
# ─────────────────────────────────────────────────────────
max-lives: 3

# ─────────────────────────────────────────────────────────
# ActionBar Display
# Continuously shows a player's current lives in the action bar.
# Set enabled: false to disable.
# interval-ticks = update frequency (20 ticks = 1 second)
# ─────────────────────────────────────────────────────────
actionbar:
  enabled: false
  interval-ticks: 60

# ─────────────────────────────────────────────────────────
# Revive Crystal Settings
# The Revive Crystal is used to revive banned players.
# You can fully customize its crafting recipe here.
# ─────────────────────────────────────────────────────────
revive-crystal:
  
  # Enable or disable crafting of the Revive Crystal.
  enabled: true
  
  # How many crystals are crafted per recipe.
  amount: 1
  
  # Crafting shape (3 lines, each 3 characters).
  # You can use any characters here as keys, as long as
  # each one is defined in the "ingredients" section below.
  #
  # Example layout:
  #   D = Diamond Block
  #   E = End Crystal
  #   S = Totem of Undying
  #
  #  D E D
  #  E S E
  #  D E D
  shape:
  - XEX
  - DSD
  - XEX
  
  # Ingredient mapping
  # Each key corresponds to a symbol used above in the shape.
  # For a full list of valid Material names, see:
  # https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
  ingredients:
    D: QUARTZ_BLOCK
    E: WRITABLE_BOOK
    S: TOTEM_OF_UNDYING

