# ─────────────────────────────────────────────────────────
# MySQL Database Settings
# If MySQL is disabled, the plugin will automatically use
# local YAML storage (plugins/LivesSMP/data.yml)
# ⚠ Ensure your database is running and accessible before enabling MySQL.
# ─────────────────────────────────────────────────────────
mysql:
  enabled: false
  host: localhost
  port: 3306
  database: livesmp
  username: root
  password: password



# ─────────────────────────────────────────────────────────
# Death Teleport (anti-lava / anti-fall loop)
# Teleports the player after respawn to a safe location.
# Runs 1 tick after respawn.
# ─────────────────────────────────────────────────────────
death-teleport:
  enabled: true
  world: world
  x: -216.5
  y: 93.5
  z: -1153.5
  yaw: -90.0
  pitch: 45.0
debug:
  enabled: false
  memory-sampler:
    enabled: false
    interval-seconds: 30
revive-teleport:
  expire-after-days: 30
  cleanup:
    enabled: true
    interval-minutes: 60


